<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>APA BizDesk | Professional Invoices</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; touch-action: manipulation; }
        canvas { touch-action: none; cursor: crosshair; }
        .no-print { display: block; }
        @media print { .no-print { display: none !important; } #doc-area { margin: 0 !important; box-shadow: none !important; width: 100% !important; border: none !important; } body { background: white !important; } }
        .bg-grid { background-image: radial-gradient(#e5e7eb 1px, transparent 1px); background-size: 20px 20px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="app"></div>

    <script>
        // App State
        let p = JSON.parse(localStorage.getItem('ap_p') || '{"name":"Your Business","curr":"₦"}');
        let ds = JSON.parse(localStorage.getItem('ap_d') || '[]');
        let v = p.email ? 'dashboard' : 'onboarding';
        let ad = null, its = [{ id: Date.now(), d: '', q: 1, p: 0 }], ly = 'Classic', m = 'Invoice', sigData = null;

        function render() {
            const root = document.getElementById('app');
            if (v === 'onboarding') {
                root.innerHTML = `
                <div class="p-6 max-w-md mx-auto min-h-screen flex flex-col justify-center">
                    <h2 class="text-3xl font-black mb-6 uppercase tracking-tighter">Business Profile</h2>
                    <div class="space-y-4">
                        <input id="bn" class="w-full p-4 border rounded-2xl font-bold" placeholder="Business Name" value="${p.name}">
                        <input id="be" class="w-full p-4 border rounded-2xl" placeholder="Your Email" value="${p.email || ''}">
                        <textarea id="ba" class="w-full p-4 border rounded-2xl" placeholder="Address">${p.addr || ''}</textarea>
                        <select id="bc" class="w-full p-4 border rounded-2xl font-bold">
                            <option value="₦">NGN (₦)</option>
                            <option value="$">USD ($)</option>
                            <option value="£">GBP (£)</option>
                        </select>
                        <button onclick="saveP()" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-black shadow-xl">SAVE & CONTINUE</button>
                    </div>
                </div>`;
            } else if (v === 'dashboard') {
                root.innerHTML = `
                <div class="p-6 max-w-lg mx-auto">
                    <div class="flex justify-between items-center mb-10">
                        <div><p class="text-[9px] font-black text-slate-400 uppercase tracking-widest leading-none">Business</p><h1 class="text-2xl font-black tracking-tighter text-slate-900">${p.name}</h1></div>
                        <button onclick="setV('onboarding')" class="p-3 bg-white border rounded-2xl shadow-sm"><i data-lucide="settings"></i></button>
                    </div>
                    <div class="grid gap-4 mb-10">
                        <button onclick="stD('Invoice')" class="p-8 bg-blue-600 text-white rounded-[2.5rem] font-black flex justify-between items-center shadow-xl shadow-blue-100"><span>NEW INVOICE</span><i data-lucide="plus"></i></button>
                        <button onclick="stD('Receipt')" class="p-8 bg-green-600 text-white rounded-[2.5rem] font-black flex justify-between items-center shadow-xl shadow-green-100"><span>NEW RECEIPT</span><i data-lucide="plus"></i></button>
                    </div>
                    <div class="bg-white border border-slate-100 p-8 rounded-[2.5rem] shadow-sm">
                        <h3 class="text-[10px] font-black text-slate-300 uppercase mb-6 tracking-widest">Recent Activity</h3>
                        <div class="space-y-4">
                            ${ds.length ? ds.slice().reverse().map(d => `
                                <div onclick="viD(${d.id})" class="flex justify-between items-center pb-4 border-b border-slate-50 last:border-0 cursor-pointer">
                                    <div><p class="font-bold text-slate-900">${d.client}</p><p class="text-[9px] text-slate-400 uppercase font-bold">${d.date} • ${d.type}</p></div>
                                    <p class="font-black ${d.type === 'Receipt' ? 'text-green-600' : 'text-slate-900'}">${p.curr}${d.total.toLocaleString()}</p>
                                </div>`).join('') : '<p class="text-center text-slate-300 py-6 font-bold text-[10px] uppercase">No activity yet</p>'}
                        </div>
                    </div>
                    <footer class="py-12 text-center opacity-30 text-[9px] font-black uppercase tracking-widest">Powered by AI Profit Academy</footer>
                </div>`;
            } else if (v === 'create') {
                root.innerHTML = `
                <div class="p-6 max-w-lg mx-auto pb-32 font-sans bg-slate-50 min-h-screen">
                    <button onclick="setV('dashboard')" class="mb-6 flex items-center gap-2 text-slate-400 font-bold"><i data-lucide="chevron-left"></i> BACK</button>
                    <h2 class="text-2xl font-black mb-8 uppercase tracking-tighter">New ${m}</h2>
                    <div class="space-y-4">
                        <input id="cn" class="w-full p-5 bg-white border rounded-2xl font-bold shadow-sm" placeholder="Customer Name">
                        <div id="items-container" class="space-y-4">
                            ${its.map((it, i) => `
                            <div class="p-6 bg-white border rounded-[2rem] shadow-sm space-y-4">
                                <input onchange="upI(${i},'d',this.value)" class="w-full border-b font-bold p-1 outline-none" placeholder="Item Description" value="${it.d}">
                                <div class="flex gap-4">
                                    <div class="flex-1"><p class="text-[8px] font-black text-slate-300 uppercase">Qty</p><input type="number" onchange="upI(${i},'q',this.value)" class="w-full bg-transparent border-b font-bold p-1" value="${it.q}"></div>
                                    <div class="flex-1"><p class="text-[8px] font-black text-slate-300 uppercase">Price</p><input type="number" onchange="upI(${i},'p',this.value)" class="w-full bg-transparent border-b font-bold p-1" value="${it.p || ''}"></div>
                                </div>
                            </div>`).join('')}
                        </div>
                        <button onclick="adI()" class="w-full py-3 border-2 border-dashed rounded-xl text-slate-400 font-bold text-xs uppercase">+ ADD ANOTHER ITEM</button>
                        
                        <div class="p-6 bg-white border rounded-[2rem] shadow-sm">
                            <div class="flex justify-between items-center mb-4">
                                <label class="text-[10px] font-black text-slate-400 uppercase">Handwritten Signature</label>
                                ${sigData ? '<button onclick="openSig()" class="text-[10px] text-blue-500 font-bold uppercase underline">Edit Signature</button>' : ''}
                            </div>
                            ${sigData ? `<div class="bg-slate-50 p-4 rounded-xl flex justify-center"><img src="${sigData}" class="h-16 object-contain"></div>` : 
                            `<button onclick="openSig()" class="w-full py-6 border-2 border-dashed border-slate-200 rounded-2xl text-slate-300 font-bold flex flex-col items-center gap-2 italic"><i data-lucide="pen-tool"></i> Tap to Sign Manually</button>`}
                        </div>

                        <button onclick="prD()" class="w-full py-5 bg-slate-900 text-white rounded-[2rem] font-black text-lg shadow-xl uppercase tracking-widest mt-6">Preview ${m}</button>
                    </div>
                </div>`;
            } else if (v === 'preview') {
                root.innerHTML = `
                <div class="p-4 bg-slate-200 min-h-screen pb-40">
                    <div class="max-w-xl mx-auto">
                        <div class="flex justify-between items-center mb-6 no-p">
                            <button onclick="setV('dashboard')" class="text-xs font-black text-slate-500 uppercase tracking-widest">Dashboard</button>
                            <div class="flex gap-1 overflow-x-auto p-1 bg-white rounded-xl shadow-sm max-w-[220px]">
                                ${['Classic','Modern','Corporate','Tech'].map(t => `<button onclick="setL('${t}')" class="px-2.5 py-1.5 rounded-lg text-[8px] font-black transition ${ly === t ? 'bg-slate-900 text-white' : 'text-slate-400'}">${t.toUpperCase()}</button>`).join('')}
                            </div>
                        </div>
                        <div id="doc-area" class="bg-white p-10 shadow-2xl min-h-[850px] flex flex-col relative overflow-hidden ${getL()}">
                            ${ad.type === 'Receipt' ? '<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-9xl font-black -rotate-12 opacity-5 pointer-events-none uppercase">PAID</div>' : ''}
                            <div class="flex justify-between items-start mb-12 border-b pb-8">
                                <div><h2 class="text-2xl font-black uppercase tracking-tighter">${p.name}</h2><p class="text-[10px] text-slate-400 font-bold uppercase mt-1 leading-tight">${p.addr || ''}</p></div>
                                <div class="text-right">
                                    <h1 class="text-4xl font-black italic text-slate-100 uppercase tracking-tighter">${ad.type}</h1>
                                    <p class="text-[10px] font-black mt-2 uppercase tracking-widest">NO: ${ad.num}</p>
                                    <p class="text-[9px] text-slate-400 font-bold uppercase">${ad.date}</p>
                                </div>
                            </div>
                            <div class="mb-12"><p class="text-[9px] font-black text-slate-300 uppercase mb-2">Customer</p><p class="font-black text-2xl leading-none">${ad.client}</p></div>
                            <table class="w-full mb-12 text-left border-collapse">
                                <thead><tr class="border-b-2 border-slate-900 text-[10px] font-black text-slate-400 uppercase"><th class="pb-2">Description</th><th class="pb-2 text-right">Total</th></tr></thead>
                                <tbody>
                                    ${ad.items.map(it => `<tr class="border-b border-slate-50"><td class="py-5 text-sm font-bold text-slate-700">${it.d} (${p.curr}${it.p.toLocaleString()} x ${it.q})</td><td class="py-5 text-right font-black text-slate-900">${p.curr}${(it.q * it.p).toLocaleString()}</td></tr>`).join('')}
                                </tbody>
                            </table>
                            <div class="mt-auto flex justify-between items-end border-t-2 border-slate-900 pt-8">
                                <div>
                                    ${ad.sig ? `<img src="${ad.sig}" class="h-14 mb-1 object-contain"><p class="text-[7px] font-black text-slate-300 border-t w-24 pt-1 uppercase">Authorized Signature</p>` : ''}
                                </div>
                                <div class="text-right">
                                    <p class="text-[10px] font-black text-slate-900 uppercase mb-1">Total ${ad.type === 'Invoice' ? 'Due' : 'Paid'}</p>
                                    <p class="text-5xl font-black text-slate-900">${p.curr}${ad.total.toLocaleString()}</p>
                                </div>
                            </div>
                            <div class="mt-16 text-center border-t border-slate-50 pt-8 opacity-30 text-[9px] font-black uppercase italic">${p.note || 'Thank you for your business!'}</div>
                        </div>
                        <button onclick="window.print()" class="w-full mt-6 py-5 bg-slate-900 text-white rounded-[2rem] font-black shadow-2xl flex justify-center gap-3 items-center no-p uppercase tracking-widest"><i data-lucide="printer"></i> DOWNLOAD / PRINT</button>
                    </div>
                </div>`;
            }
            lucide.createIcons();
        }

        // Logic
        window.setV = (newV) => { v = newV; render(); };
        window.setL = (newL) => { ly = newL; render(); };
        window.stD = (t) => { m = t; sigData = null; its = [{ id: Date.now(), d: '', q: 1, p: 0 }]; v = 'create'; render(); };
        window.adI = () => { its.push({ id: Date.now(), d: '', q: 1, p: 0 }); render(); };
        window.upI = (i, f, val) => { its[i][f] = f === 'd' ? val : Number(val); };
        window.saveP = () => { p.name = document.getElementById('bn').value; p.email = document.getElementById('be').value; p.addr = document.getElementById('ba').value; p.curr = document.getElementById('bc').value; localStorage.setItem('ap_p', JSON.stringify(p)); v = 'dashboard'; render(); };
        window.prD = () => { const total = its.reduce((a, b) => a + (b.q * b.p), 0); ad = { client: document.getElementById('cn').value, type: m, items: [...its], total: total, num: (m === 'Invoice' ? 'INV-' : 'REC-') + Math.floor(1000 + Math.random() * 9000), date: new Date().toLocaleDateString(), sig: sigData, id: Date.now() }; ds.push(ad); localStorage.setItem('ap_d', JSON.stringify(ds)); v = 'preview'; render(); };
        window.viD = (id) => { ad = ds.find(d => d.id === id); sigData = ad.sig; v = 'preview'; render(); };

        // Signature Pad Logic
        window.openSig = () => {
            const overlay = document.createElement('div');
            overlay.className = "fixed inset-0 bg-slate-900/95 z-[60] flex items-center justify-center p-6";
            overlay.id = "sig-overlay";
            overlay.innerHTML = `
                <div class="bg-white w-full max-w-md rounded-[2.5rem] p-8 shadow-2xl">
                    <div class="flex justify-between items-center mb-6"><h3 class="font-black uppercase text-xs">Manual Signature</h3><button onclick="document.getElementById('sig-overlay').remove()"><i data-lucide="x"></i></button></div>
                    <div class="bg-slate-50 border-b-2 border-slate-900 mb-8 relative h-48 rounded-xl overflow-hidden">
                        <canvas id="sig-canvas" width="400" height="200" class="w-full h-full"></canvas>
                        <div class="absolute bottom-6 left-10 right-10 border-t border-slate-200 pointer-events-none"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <button onclick="clearSig()" class="py-4 bg-slate-100 text-slate-500 font-bold rounded-2xl uppercase text-xs">Clear</button>
                        <button onclick="saveSig()" class="py-4 bg-green-600 text-white font-bold rounded-2xl uppercase text-xs">Save Signature</button>
                    </div>
                    <button onclick="document.getElementById('sig-overlay').remove()" class="w-full mt-4 text-slate-300 font-bold text-[10px] uppercase">Cancel</button>
                </div>
            `;
            document.body.appendChild(overlay);
            lucide.createIcons();
            initCanvas();
        };

        let ctx, drawing = false;
        function initCanvas() {
            const c = document.getElementById('sig-canvas');
            ctx = c.getContext('2d'); ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.strokeStyle = '#0f172a';
            const stop = () => drawing = false;
            c.addEventListener('mousedown', () => drawing = true);
            c.addEventListener('touchstart', (e) => { drawing = true; e.preventDefault(); });
            window.addEventListener('mouseup', stop);
            window.addEventListener('touchend', stop);
            c.addEventListener('mousemove', drawStroke);
            c.addEventListener('touchmove', (e) => { drawStroke(e); e.preventDefault(); });
        }
        function drawStroke(e) {
            if (!drawing) return;
            const c = document.getElementById('sig-canvas'), r = c.getBoundingClientRect();
            const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
            const y = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
            ctx.lineTo(x, y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x, y);
        }
        window.clearSig = () => { const c = document.getElementById('sig-canvas'); ctx.clearRect(0,0,c.width,c.height); };
        window.saveSig = () => { sigData = document.getElementById('sig-canvas').toDataURL(); document.getElementById('sig-overlay').remove(); render(); };
        
        function getL() {
            if (ly === 'Modern') return 'border-l-[25px] border-blue-600 bg-slate-50';
            if (ly === 'Bold') return 'border-t-[40px] border-slate-900 bg-slate-100';
            if (ly === 'Tech') return 'bg-slate-900 text-slate-300 border-b-[20px] border-green-500';
            return 'border-t-[15px] border-slate-900';
        }

        render();
    </script>
</body>
</html>
